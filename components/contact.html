<!-- Contact Section -->
<section id="contact" class="py-20 bg-white">
    <div class="container mx-auto px-6">
        <div class="text-center mb-16">
            <h2 class="text-4xl font-bold text-gray-800 mb-4">Have any questions? <span class="text-blue-600">Write to us.</span></h2>
        </div>
        
        <div class="max-w-2xl mx-auto">
            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Name</label>
                        <input type="text" placeholder="Your Name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-2">Email</label>
                        <input type="email" placeholder="Your Email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Message</label>
                    <textarea placeholder="Tell us how we can help you..." rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</section>

<!-- Success Message -->
<div id="successMessage" class="fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 opacity-0 invisible z-50">
    <div class="flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span>Message sent successfully!</span>
    </div>
</div>

<!-- Contact JavaScript -->
<script>
    // Form submission
    const contactForm = document.querySelector('form');
    const successMessage = document.getElementById('successMessage');
    
    if (contactForm && successMessage) {
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show success message
            successMessage.classList.remove('translate-x-full', 'opacity-0', 'invisible');
            successMessage.classList.add('translate-x-0', 'opacity-100', 'visible');
            
            // Reset form
            contactForm.reset();
            
            // Hide message after 3 seconds
            setTimeout(() => {
                successMessage.classList.add('translate-x-full', 'opacity-0', 'invisible');
                successMessage.classList.remove('visible');
            }, 3000);
        });
    }
</script>
