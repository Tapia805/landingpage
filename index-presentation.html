<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPro - Your Pet's Health is Our Priority</title>
    <meta name="description" content="PetPro - Professional pet care services. Your pet's health is our priority.">
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Loading indicator -->
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .loading-content {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-inter">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h2 class="text-2xl font-bold mb-2">Loading PetPro...</h2>
            <p class="text-lg opacity-90">Preparing your pet care experience</p>
        </div>
    </div>

    <!-- Include Header -->
    <div id="header"></div>
    
    <!-- Main Content -->
    <main class="pt-16">
        
        <!-- Include Sections -->
        <div id="sections"></div>
        
        <!-- Include Services -->
        <div id="services"></div>
        
        <!-- Include Testimonials -->
        <div id="testimonials"></div>
        
        <!-- Include Feature -->
        <div id="feature"></div>
        
        <!-- Include Contact -->
        <div id="contact"></div>
    </main>

    <!-- Include Footer -->
    <div id="footer"></div>

    <!-- JavaScript -->
    <script src="js/scripts.js"></script>
    
    <!-- Load Components with Loading Indicator -->
    <script>
        // Load HTML components with loading indicator
        async function loadComponents() {
            const components = [
                { id: 'header', url: 'components/header.html' },
                { id: 'sections', url: 'components/sections.html' },
                { id: 'services', url: 'components/services.html' },
                { id: 'testimonials', url: 'components/testimonials.html' },
                { id: 'feature', url: 'components/feature.html' },
                { id: 'contact', url: 'components/contact.html' },
                { id: 'footer', url: 'components/footer.html' }
            ];
            
            try {
                for (const component of components) {
                    const response = await fetch(component.url);
                    const html = await response.text();
                    document.getElementById(component.id).innerHTML = html;
                }
                
                // Hide loading overlay
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }, 500);
                
            } catch (error) {
                console.error('Error loading components:', error);
                // Hide loading overlay even if there's an error
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
        
        // Start loading components
        loadComponents();
    </script>
</body>
</html>
